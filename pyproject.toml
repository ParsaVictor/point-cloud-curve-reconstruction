[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-curve-reconstruction"
version = "0.1.0"
description = "3D point cloud denoising and curve reconstruction — five peer-reviewed algorithms benchmarked on industrial scan data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mohammad Parsa Karkooti", email = "1.parsa.karkooti@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
notebooks = [
    "open3d>=0.17",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "scikit-learn>=1.1",
]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
